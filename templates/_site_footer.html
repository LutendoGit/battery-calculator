<style>
    .site-footer.footer {
        background-color: #666868;
        color: #FFFFFF;
        padding: 40px 24px;
        margin-top: 56px;
        text-align: center;
        line-height: 1.6;
    }

    .site-footer.footer .footer-brand {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        margin-bottom: 4px;
        color: #FFFFFF;
    }

    .site-footer.footer .site-footer-links {
        margin-top: 6px;
    }

    .site-footer.footer a,
    .site-footer.footer .site-footer-link {
        color: #A3E635;
        text-decoration: none;
        font-weight: 600;
    }

    .site-footer.footer a:hover,
    .site-footer.footer .site-footer-link:hover {
        text-decoration: underline;
    }

    .site-footer.footer .site-footer-copy {
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.74);
    }

    .site-footer.footer.footer-tech {
        background: rgba(255, 255, 255, 0.06);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 16px;
        margin-top: 18px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .site-footer.footer.footer-tech .site-footer-copy {
        color: rgba(255, 255, 255, 0.65);
    }

    @media (min-width: 768px) {
        .site-footer.footer {
            text-align: left;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            align-items: start;
        }
    }

    @media (min-width: 1024px) {
        .site-footer.footer {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    @media (max-width: 576px) {
        .site-footer.footer.footer-tech {
            padding: 22px 14px;
            margin-top: 12px;
            border-radius: 12px;
            line-height: 1.45;
        }

        .site-footer.footer.footer-tech .footer-brand {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .site-footer.footer.footer-tech .site-footer-links,
        .site-footer.footer.footer-tech .site-footer-copy {
            margin-top: 4px;
        }
    }
</style>

<div class="site-footer footer{% if footer_theme|default('default') == 'tech' %} footer-tech{% endif %}">
        <div class="footer-brand">Revov WattWorks</div>
        <div>Installer Training Platform &middot; Empowering Energy Professionals</div>
        <div class="site-footer-links"><a href="{{ url_for('education.learn_index', hub=1) }}" class="site-footer-link">Training Hub</a> &middot; <a href="{{ url_for('index') }}" class="site-footer-link">Home</a></div>
        <div class="site-footer-copy">&copy; 2026 Revov Energy. All rights reserved.</div>
</div>
